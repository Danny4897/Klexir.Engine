name: Release & Publish

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write

env:
  DOTNET_VERSION: '8.0.x'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - run: dotnet restore Klexir.Engine.sln
      - run: dotnet build Klexir.Engine.sln --configuration Release --no-restore
      - run: dotnet test Klexir.Engine.sln --configuration Release --no-build --verbosity normal

  release:
    name: Pack & Publish
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - run: dotnet restore Klexir.Engine.sln
      - run: dotnet build Klexir.Engine.sln --configuration Release --no-restore

      - name: Set version
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Pack
        run: |
          dotnet pack src/Klexir.Engine.Abstractions/Klexir.Engine.Abstractions.csproj \
            --configuration Release \
            --no-build \
            --output ./nupkgs \
            -p:PackageVersion=${{ steps.version.outputs.VERSION }}

      - name: List packages
        run: ls -lh ./nupkgs/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Klexir.Engine ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: ./nupkgs/*.nupkg

      - name: Add GitHub Packages source
        run: |
          dotnet nuget add source \
            "https://nuget.pkg.github.com/Danny4897/index.json" \
            --name github \
            --username Danny4897 \
            --password ${{ secrets.GITHUB_TOKEN }} \
            --store-password-in-clear-text

      - name: Push to GitHub Packages
        run: |
          dotnet nuget push ./nupkgs/*.nupkg \
            --source github \
            --skip-duplicate

      - name: Push to NuGet.org
        if: ${{ secrets.NUGET_API_KEY != '' }}
        run: |
          dotnet nuget push ./nupkgs/*.nupkg \
            --api-key ${{ secrets.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
